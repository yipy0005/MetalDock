[workspace]
name = "metaldock"
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "1.0.0"

# Python 3.8 is the version MetalDock was written and tested with. The code needs `distutils`
# (removed in Python 3.12) and ase 3.22.1.
[dependencies]
python = "3.8.*"
openbabel = "*"
ase = "==3.22.1"
networkx = "*"
numpy = "*"
scipy = "*"
pandas = "*"
pdb2pqr = "*"
typing_extensions = "*"

# PLAMS (the ADF/AMS interface, `scm.plams`) is only on PyPI.
[pypi-dependencies]
plams = "*"

# `pixi run metaldock` starts the guided interface (and, with -i/-m, the classic program) in this folder. To work in
# your own folder instead, see README.md.
[tasks]
metaldock = "python metaldock_cli.py"

# Tests for the guided interface: `pixi run -e dev test`
[feature.dev.dependencies]
pytest = ">=7"

[feature.dev.tasks]
test = "pytest test -q"

[environments]
dev = { features = ["dev"] }
